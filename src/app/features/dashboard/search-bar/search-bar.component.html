 <div class="relative group">
      <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
       <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-5 h-5 text-slate-400 group-focus-within:text-blue-500 transition-colors"
          >
        <path
        stroke-linecap="round"
         stroke-linejoin="round"
          d="m21 21-4.35-4.35m0 0A7.5 7.5 0 1 0 5.4 5.4a7.5 7.5 0 0 0 11.25 11.25Z"
         />
          </svg>
      </div>

      <input
        [formControl]="searchControl"
        type="text"
        placeholder="Buscar ciudad (ej. Jutiapa, Acatenango)..."
        class="w-full py-4 pl-12 pr-12 rounded-xl bg-slate-800/80 text-white border border-slate-700 focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-lg placeholder:text-slate-500 font-medium"
      >

      @if (searchControl.value) {
        <button
          (click)="clearSearch()"
          class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-white transition-colors"
          title="Limpiar búsqueda"
        >
          <svg
          xmlns="http://www.w3.org/2000/svg"
  fill="none"
  viewBox="0 0 24 24"
  stroke-width="1.5"
  stroke="currentColor"
  class="w-5 h-5"
>
  <path
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M6 18 18 6M6 6l12 12"
  />
</svg>
        </button>
      }
    </div>
