  <div>
      <h3 class="text-lg font-semibold text-slate-300 mb-4 flex items-center gap-2">
        <svg
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  viewBox="0 0 24 24"
  stroke-width="1.5"
  stroke="currentColor"
  class="w-10 h-10 text-amber-400 mb-3"
>
  <circle
    cx="12"
    cy="13"
    r="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M12 13l4-2"
  />
  <path
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M12 3v2"
  />
</svg> Búsquedas Recientes
      </h3>
      <div class="flex flex-col gap-3">
        @for (city of weatherService.searchHistory(); track city.name) {
          <button
            (click)="searchAgain(city.name)"
            class="flex justify-between items-center bg-slate-700/50 hover:bg-slate-600 p-3 rounded-lg transition-colors text-left group"
          >
            <span class="text-white font-medium group-hover:text-blue-400 transition-colors">
              {{ city.name }}
            </span>
            <span class="text-slate-300 flex items-center gap-2">
              {{ city.main.temp | number:'1.0-0' }}°C
              <span class="text-xl">{{ city.weather[0].main  }}</span>
            </span>
          </button>
        } @empty {
          <div class="text-center p-4 border border-dashed border-slate-600 rounded-lg text-slate-500 text-sm">
            Tus últimas búsquedas aparecerán aquí.
          </div>
        }
      </div>
    </div>
