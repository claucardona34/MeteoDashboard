@switch (condition()) {

 @case ('Clear') {
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    class="w-20 h-20 text-yellow-400"
  >
    <circle cx="12" cy="12" r="5" />

    <line x1="12" y1="1" x2="12" y2="4" />
    <line x1="12" y1="20" x2="12" y2="23" />

    <line x1="1" y1="12" x2="4" y2="12" />
    <line x1="20" y1="12" x2="23" y2="12" />

    <line x1="4.2" y1="4.2" x2="6.3" y2="6.3" />
    <line x1="17.7" y1="17.7" x2="19.8" y2="19.8" />

    <line x1="4.2" y1="19.8" x2="6.3" y2="17.7" />
    <line x1="17.7" y1="6.3" x2="19.8" y2="4.2" />
  </svg>
}

  @case ('Clouds') {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="w-20 h-20 text-slate-400"
    >
      <path d="M18 18H7a4 4 0 010-8 5 5 0 019.6-1.4A4 4 0 1118 18z"/>
    </svg>
  }

  @case ('Rain') {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="w-20 h-20 text-blue-400"
    >
      <path d="M18 16H7a4 4 0 010-8 5 5 0 019.6-1.4A4 4 0 1118 16z"/>
      <path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/>
    </svg>
  }

  @case ('Drizzle') {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="w-20 h-20 text-sky-400"
    >
      <path d="M18 16H7a4 4 0 010-8 5 5 0 019.6-1.4A4 4 0 1118 16z"/>
      <circle cx="9" cy="20" r="1"/>
      <circle cx="13" cy="21" r="1"/>
      <circle cx="17" cy="20" r="1"/>
    </svg>
  }

  @case ('Thunderstorm') {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="w-20 h-20 text-purple-400"
    >
      <path d="M18 16H7a4 4 0 010-8 5 5 0 019.6-1.4A4 4 0 1118 16z"/>
      <path d="M12 16l-2 4h2l-1 4 5-6h-3l2-2z"/>
    </svg>
  }

  @case ('Snow') {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="currentColor"
      class="w-20 h-20 text-cyan-200"
    >
      <path d="M12 2v20M4 7l16 10M20 7L4 17"/>
    </svg>
  }

  @default {
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-20 h-20 text-slate-400"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 2.25c5.385 0 9.75 4.365 9.75 9.75s-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12 6.615 2.25 12 2.25Z"
      />
    </svg>
  }

}
